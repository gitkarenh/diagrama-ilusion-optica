<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>Refraccion de la luz del aire al agua</title>
  <desc>Un rayo de luz cambia de direccion al pasar del aire al agua y se acerca a la normal.</desc>
  <rect width="800" height="240" fill="#F4EBD8" stroke="#173B4D" stroke-width="6"/>
  <rect y="240" width="800" height="260" fill="#5B9BB5" stroke="#173B4D" stroke-width="6"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#A65D43" stroke-width="8"/>
  <line x1="400" y1="55" x2="400" y2="450" stroke="#A65D43" stroke-width="5" stroke-dasharray="12 12"/>
  <line x1="170" y1="70" x2="400" y2="240" stroke="#E6B84A" stroke-width="10"/>
  <line x1="400" y1="240" x2="500" y2="430" stroke="#E6B84A" stroke-width="10"/>
  <polygon points="400,240 382,246 398,256" fill="#E6B84A"/>
  <polygon points="500,430 485,418 503,414" fill="#E6B84A"/>
  <text x="35" y="55" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="#173B4D">AIRE</text>
  <text x="35" y="285" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="#173B4D">AGUA</text>
  <text x="420" y="90" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#173B4D">NORMAL</text>
  <text x="80" y="120" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#173B4D">RAYO DE LUZ</text>
  <text x="505" y="375" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#173B4D">SE ACERCA A LA NORMAL</text>
  <text x="245" y="225" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#173B4D">CAMBIO DE MEDIO</text>
</svg>
